<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Moderação</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/community.css">
    <link rel="stylesheet" href="../../css/moderation.css">
</head>
<body class="r">
    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="main-content" id="main-content">
        <div class="mod-page">
            <nav class="mod-breadcrumb" aria-label="Você está em">
                <a id="backToCommunity" href="../home.html">Comunidade</a>
                <span aria-hidden="true">›</span>
                <span aria-current="page">Moderação</span>
            </nav>
            <h1 class="mod-title" id="modTitle">Moderação</h1>
            <p class="mod-status" id="modStatus">Carregando...</p>

            <!-- Visível só para dono e moderadores (community-moderation.ts). -->
            <div id="modContent" hidden>
                <section class="mod-section" aria-labelledby="reportsTitle">
                    <h2 class="mod-section-title" id="reportsTitle">Denúncias</h2>
                    <div id="reportQueue"></div>
                </section>

                <section class="mod-section" aria-labelledby="bansTitle">
                    <h2 class="mod-section-title" id="bansTitle">Banidos</h2>
                    <ul class="mod-bans" id="bansList"></ul>
                </section>
            </div>
        </div>
    </main>

    <script type="module" src="../../script/community-moderation.ts"></script>
    <script type="module" src="../../script/shared/chat-widget.ts"></script>
</body>
</html>
