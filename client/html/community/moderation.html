<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Moderação</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/moderation.css">
</head>
<body class="r">
    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="main-content" id="main-content">
        <div class="r-col">
            <nav class="r-crumb" aria-label="Você está em">
                <a id="backToCommunity" href="../home.html">Comunidade</a>
                <span class="r-crumb-sep" aria-hidden="true">›</span>
                <span aria-current="page">Moderação</span>
            </nav>
            <h1 class="r-ptitle" id="modTitle">Moderação</h1>
            <p class="mod-status" id="modStatus">Carregando...</p>

            <!-- Visível só para dono e moderadores (community-moderation.ts). -->
            <div class="mod-content" id="modContent" hidden>
                <div class="r-tabs">
                    <div class="fx-tabs" role="tablist" aria-label="Moderação" id="modTabs">
                        <button type="button" class="fx-tab" role="tab" id="modTab-denuncias" aria-controls="modPanel-denuncias" data-tab="denuncias" aria-selected="true">Denúncias</button>
                        <button type="button" class="fx-tab" role="tab" id="modTab-banidos" aria-controls="modPanel-banidos" data-tab="banidos" aria-selected="false">Banidos</button>
                    </div>
                </div>

                <section class="mod-panel" id="modPanel-denuncias" role="tabpanel" aria-labelledby="modTab-denuncias">
                    <div class="mod-queue" id="reportQueue"></div>
                </section>

                <section class="mod-panel" id="modPanel-banidos" role="tabpanel" aria-labelledby="modTab-banidos" hidden>
                    <p class="mod-summary" id="bansSummary" aria-live="polite"></p>
                    <ul class="fx-members r-edge" id="bansList"></ul>
                </section>
            </div>
        </div>
    </main>

    <script type="module" src="../../script/community-moderation.ts"></script>
    <script type="module" src="../../script/shared/chat-widget.ts"></script>
</body>
</html>
