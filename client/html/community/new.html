<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Nova Comunidade</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/community-new.css">
</head>
<body class="community-new-page">
    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="main-content community-new-main">
    <div class="page-card">
        <div class="page-header">
            <h1 id="pageTitle">Criar comunidade</h1>
            <p id="pageSubtitle">Preencha os dados para criar sua comunidade e escolha uma capa personalizada.</p>
        </div>
        <div class="page-body">
            <form id="communityForm" novalidate>
                <div class="form-error" id="formError" role="alert"></div>

                <div class="form-field">
                    <label for="communityName">Nome da comunidade</label>
                    <input id="communityName" name="communityName" type="text"
                           placeholder="Ex: Gamers do bairro" maxlength="80" required>
                </div>

                <div class="form-field">
                    <label for="communityCategory">Categoria</label>
                    <select id="communityCategory" name="communityCategory" required disabled>
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="communityDescription">Descrição <span class="field-hint">(opcional)</span></label>
                    <textarea id="communityDescription" name="communityDescription"
                              maxlength="500" placeholder="Sobre o que é a sua comunidade?"></textarea>
                </div>

                <!-- Só no modo edição: as regras aparecem na vista "Regras" da comunidade. -->
                <div class="form-field" id="rulesField" hidden>
                    <label for="communityRules">Regras <span class="field-hint">(opcional)</span></label>
                    <textarea id="communityRules" name="communityRules" maxlength="5000" rows="6"
                              placeholder="Uma regra por linha. Ex.: 1. Respeite os outros membros."></textarea>
                </div>

                <div class="form-field">
                    <label for="communityCover">Capa da comunidade <span class="field-hint">(opcional)</span></label>
                    <input id="communityCover" name="communityCover" type="file"
                           accept="image/png,image/jpeg,image/webp">
                    <span class="field-hint">PNG, JPEG ou WebP. Máximo 2MB.</span>
                </div>

                <!-- Só no modo edição, quando a comunidade já tem capa. -->
                <label class="checkbox-field" id="removeCoverField" hidden>
                    <input type="checkbox" id="removeCover"> Remover a capa atual
                </label>

                <div class="image-preview" id="imagePreview">Nenhuma imagem selecionada</div>

                <div class="actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Voltar</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Criar comunidade</button>
                </div>
            </form>

            <!-- Só no modo edição: exclusão pelo dono, com o nome digitado. -->
            <section class="danger-zone" id="dangerZone" hidden>
                <h2>Excluir comunidade</h2>
                <p>A comunidade some para todos os membros, junto com as discussões. Esta ação não pode ser desfeita pela interface.</p>
                <button type="button" class="btn btn-danger" id="deleteCommunityBtn">Excluir comunidade</button>
            </section>
        </div>
    </div>
    </main>

    <script type="module" src="../../script/community-new.ts"></script>
</body>
</html>
