<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Meu Perfil</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/profile/profile-view.css">
</head>
<body>

    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <!-- CONTEÚDO PRINCIPAL DO PERFIL PÚBLICO -->
    <main class="main-content" id="main-content">
        <div class="perfil-container">

            <!-- Banner -->
            <div class="banner">
                <!-- Imagem do Usuário -->
                <div class="profile-picture"></div>
            </div>
            
            <!-- Ações do Header (Botão Editar Perfil) -->
            <div class="profile-header-actions">
                <a href="profile-settings.html" class="btn-edit-profile">Editar Perfil</a>
            </div>

            <!-- Informações Públicas do Perfil -->
            <div class="profile-info-section">
                <h1 class="profile-name">Nome do Usuário<span id="privatePadlockProfile" style="display:none; margin-left:12px;" title="Perfil Privado"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span></h1>
                <h2 class="profile-username">@usuario</h2>
                
                <p class="profile-bio">
                    Sua biografia aparecerá aqui...
                </p>
                
                <div class="profile-stats">
                    <span><strong>0</strong> Seguindo</span>
                    <span><strong>0</strong> Seguidores</span>
                </div>
            </div>

            <!-- Navegação Pessoal -->
            <div class="profile-tabs">
                <button class="tab-btn active">Posts</button>
                <button class="tab-btn">Respostas</button>
                <button class="tab-btn">Recursos</button>
            </div>

            <!-- Conteúdo em Branco / Feed -->
            <div class="profile-feed">
                <div class="empty-state">
                    Você ainda não publicou nenhum post.
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="../../script/user-script/profile-view.ts"></script>
    <script type="module" src="../../script/shared/chat-widget.ts"></script>
</body>
</html>
