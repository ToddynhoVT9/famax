<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Meu Perfil</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/profile/profile-view.css">
</head>
<body>

    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <!-- CONTEÚDO PRINCIPAL DO PERFIL PÚBLICO -->
    <main class="main-content" id="main-content">
        <!-- Preenchido por profile-view.ts a partir de GET /api/users/:id -->
        <div class="perfil-container" id="profileContainer" aria-busy="true">

            <div class="banner" id="profileBanner">
                <div class="profile-picture" id="profileAvatar"></div>
            </div>

            <div class="profile-header-actions">
                <a href="profile-settings.html" class="btn-edit-profile" id="btnEditProfile" hidden>Editar perfil</a>
                <!-- Perfil de outra pessoa: Seguir / Seguindo (shared/follow.ts) -->
                <button type="button" class="follow-btn" id="btnFollow" hidden>Seguir</button>
                <!-- Abre o widget de chat na conversa com a pessoa (shared/chat-bus.ts) -->
                <button type="button" class="btn-edit-profile" id="btnMessage" hidden>Enviar mensagem</button>
                <!-- Perfil de outra pessoa, com sessão: "⋯" com Denunciar. -->
                <div class="profile-more" id="profileMore" hidden>
                    <button type="button" class="profile-more-btn" id="profileMoreBtn"
                            aria-haspopup="menu" aria-expanded="false" aria-label="Mais opções">⋯</button>
                    <div class="profile-more-menu" id="profileMoreMenu" role="menu" hidden>
                        <button type="button" class="profile-more-item" role="menuitem" id="btnBlockUser">Bloquear</button>
                        <button type="button" class="profile-more-item" role="menuitem" id="btnReportUser">Denunciar usuário</button>
                    </div>
                </div>
            </div>

            <div class="profile-info-section">
                <h1 class="profile-name">
                    <span id="profileName" class="skeleton-text">Carregando...</span>
                    <span id="privatePadlockProfile" class="private-padlock" title="Perfil privado" hidden>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <span class="visually-hidden">Perfil privado</span>
                    </span>
                </h1>
                <h2 class="profile-username" id="profileUsername"></h2>
                <p class="profile-bio" id="profileBio" hidden></p>
                <p class="profile-joined" id="profileJoined" hidden></p>
                <ul class="profile-social" id="profileSocial" hidden></ul>
                <div class="profile-stats" id="profileStats" hidden></div>
            </div>

            <!-- Perfil privado de outra pessoa: aviso no lugar das abas -->
            <div class="empty-state" id="privateNotice" hidden>
                Este perfil é privado. Só o dono pode ver os posts e as respostas.
            </div>

            <div class="profile-tabs" id="profileTabs" role="tablist" hidden>
                <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="posts">Posts</button>
                <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="comments">Respostas</button>
                <!-- Só no próprio perfil: a lista de salvos é privada. -->
                <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="saved" id="tabSaved" hidden>Salvos</button>
            </div>

            <div class="profile-feed" id="profileFeed" role="tabpanel" hidden>
                <div class="profile-feed-list" id="profileFeedList"></div>
                <div class="empty-state" id="profileFeedStatus" hidden></div>
                <button type="button" class="btn-load-more" id="btnLoadMore" hidden>Carregar mais</button>
            </div>

        </div>
    </main>

    <script type="module" src="../../script/user-script/profile-view.ts"></script>
    <script type="module" src="../../script/shared/chat-widget.ts"></script>
</body>
</html>
