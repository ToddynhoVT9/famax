<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Meu Perfil</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/profile/profile-view.css">
</head>
<body class="r">

    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <!-- CONTEÚDO PRINCIPAL DO PERFIL PÚBLICO -->
    <main class="main-content" id="main-content">
        <!-- Preenchido por profile-view.ts a partir de GET /api/users/:id.
             O topo fica na coluna de 1080; a lista, em 760 no centro. -->
        <div class="r-col r-col--wide" id="profileContainer" aria-busy="true">

            <section class="pv-profile" aria-labelledby="profileName">
                <div class="fx-profile-banner pv-banner" id="profileBanner">
                    <div class="fx-avatar pv-pic" id="profileAvatar" aria-hidden="true"></div>
                </div>

                <!-- Faixa das ações, à direita da foto (nunca embaixo dela). No
                     celular, profile-view.ts muda as ações para baixo do nome. -->
                <div class="pv-bar" id="profileBar">
                    <div class="pv-acts" id="profileActions">
                        <a href="profile-settings.html" class="fx-btn fx-btn--outline fx-btn--pill" id="btnEditProfile" hidden>Editar perfil</a>
                        <!-- Perfil de outra pessoa: Seguir / Seguindo (shared/follow.ts) -->
                        <button type="button" class="fx-btn fx-btn--pill fx-btn--primary" id="btnFollow" hidden>Seguir</button>
                        <!-- Abre o widget de chat na conversa com a pessoa (shared/chat-bus.ts) -->
                        <button type="button" class="fx-btn fx-btn--outline fx-btn--pill" id="btnMessage" hidden>Enviar mensagem</button>
                        <!-- Perfil de outra pessoa, com sessão: "⋯" com Bloquear e Denunciar. -->
                        <div class="pv-more" id="profileMore" hidden>
                            <button type="button" class="fx-btn fx-btn--outline fx-btn--pill pv-iconbtn" id="profileMoreBtn"
                                    aria-haspopup="menu" aria-expanded="false" aria-label="Mais opções do perfil"></button>
                            <div class="fx-menu" id="profileMoreMenu" role="menu" hidden>
                                <button type="button" class="fx-menu-item fx-menu-item--danger" role="menuitem" id="btnBlockUser">Bloquear</button>
                                <button type="button" class="fx-menu-item fx-menu-item--danger" role="menuitem" id="btnReportUser">Denunciar usuário</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pv-info">
                    <div class="pv-id">
                        <h1 class="fx-profile-name" id="profileName">
                            <span id="profileNameText" class="skeleton-text">Carregando...</span>
                            <span id="privatePadlockProfile" class="private-padlock" title="Perfil privado" hidden>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                <span class="visually-hidden">Perfil privado</span>
                            </span>
                        </h1>
                        <p class="fx-profile-user" id="profileUsername"></p>
                    </div>
                    <!-- Celular: as ações vêm para cá, numa linha própria. -->
                    <div class="pv-acts-slot" id="profileActionsPhone"></div>
                    <p class="fx-profile-bio" id="profileBio" hidden></p>
                    <p class="fx-profile-joined" id="profileJoined" hidden></p>
                    <ul class="fx-profile-social" id="profileSocial" hidden></ul>
                    <div class="fx-profile-stats" id="profileStats" hidden></div>
                </div>
            </section>

            <div class="pv-listcol">
                <!-- Perfil privado de outra pessoa: aviso no lugar das abas -->
                <div class="fx-empty" id="privateNotice" hidden>
                    Este perfil é privado. Só o dono pode ver os posts e as respostas.
                </div>

                <div class="r-tabs" id="profileTabsBar" hidden>
                    <div class="fx-tabs" id="profileTabs" role="tablist" aria-label="Atividade do perfil">
                        <button type="button" class="fx-tab" role="tab" aria-selected="true" aria-controls="profileFeed" data-tab="posts">Posts</button>
                        <button type="button" class="fx-tab" role="tab" aria-selected="false" aria-controls="profileFeed" data-tab="comments">Respostas</button>
                        <!-- Só no próprio perfil: a lista de salvos é privada. -->
                        <button type="button" class="fx-tab" role="tab" aria-selected="false" aria-controls="profileFeed" data-tab="saved" id="tabSaved" hidden>Salvos</button>
                    </div>
                </div>

                <div class="pv-feed" id="profileFeed" role="tabpanel" hidden>
                    <div class="pv-list" id="profileFeedList"></div>
                    <div class="fx-empty" id="profileFeedStatus" hidden></div>
                    <button type="button" class="fx-btn fx-btn--outline fx-btn--pill list-more" id="btnLoadMore" hidden>Carregar mais</button>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="../../script/user-script/profile-view.ts"></script>
    <script type="module" src="../../script/shared/chat-widget.ts"></script>
</body>
</html>
