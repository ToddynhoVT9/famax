<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Confirmar e-mail</title>
    <!-- O token vem no fragmento (#token=): não vai para o servidor nem para o Referer. -->
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/auth/auth-common.css">
    <link rel="stylesheet" href="../../css/auth/recover-password.css">
</head>
<body class="r r--nobar">
    <main class="acc" id="main-content" aria-live="polite">
        <div class="acc-col">
            <a class="acc-logo" href="../../index.html" aria-label="FAMAX, início">FAMAX</a>
            <h1 class="acc-title" id="verifyTitle">Confirmando seu e-mail...</h1>
            <p class="acc-text" id="verifyText" role="status">Só um instante.</p>
            <a class="fx-btn fx-btn--chrome acc-btn" id="verifyContinue" href="../home.html" hidden>Continuar</a>
        </div>
    </main>

    <script type="module" src="../../script/user-script/verify-email.ts"></script>
</body>
</body>
</html>
