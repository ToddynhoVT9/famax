<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Confirmar e-mail</title>
    <!-- O token vem no fragmento (#token=): não vai para o servidor nem para o Referer. -->
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/auth/auth-common.css">
    <link rel="stylesheet" href="../../css/auth/recover-password.css">
</head>
<body>
    <a class="header" href="../../index.html" aria-label="FAMAX — início">
        <span class="header-name">FAMAX</span>
    </a>

    <main class="recovery-container" aria-live="polite">
        <h1 class="recovery-title" id="verifyTitle">Confirmando seu e-mail...</h1>
        <p class="recovery-text" id="verifyText">Só um instante.</p>
        <a class="fx-btn fx-btn--chrome" id="verifyContinue" href="../home.html" hidden>Continuar</a>
    </main>

    <script type="module" src="../../script/user-script/verify-email.ts"></script>
</body>
</html>
