<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Recuperação de Senha</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/auth/auth-common.css">
    <link rel="stylesheet" href="../../css/auth/recover-password.css">
</head>
<body class="r r--nobar">
    <main class="acc" id="main-content">
        <div class="acc-col">
            <a class="acc-logo" href="../../index.html" aria-label="FAMAX, início">FAMAX</a>
            <!-- O mesmo título nos três passos, no mesmo lugar. -->
            <h1 class="acc-title">Recuperar senha</h1>

            <!-- Passo 1: e-mail -->
            <form class="acc-form" id="email-step" novalidate>
                <div class="fx-banner fx-banner--danger" id="email-error" role="alert" hidden></div>
                <p class="acc-text">Informe o e-mail da sua conta. Enviaremos um código de 6 dígitos.</p>
                <div class="fx-field">
                    <label class="fx-label" for="email-input">E-mail</label>
                    <input type="email" class="fx-input" id="email-input" placeholder="ana@exemplo.com"
                        autocomplete="email" required>
                </div>
                <button type="submit" class="fx-btn fx-btn--chrome" id="sendCodeButton">Enviar código</button>
            </form>

            <!-- Passo 2: código -->
            <form class="acc-form" id="code-step" novalidate hidden>
                <div class="fx-banner fx-banner--danger" id="code-error" role="alert" hidden></div>
                <p class="acc-text" id="code-sent-text"></p>
                <div class="fx-field">
                    <label class="fx-label" for="code-input">Código de 6 dígitos</label>
                    <input type="text" class="fx-input acc-code" id="code-input" placeholder="000000"
                        inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
                </div>
                <button type="submit" class="fx-btn fx-btn--chrome" id="verifyCodeButton">Confirmar código</button>
                <div class="acc-links">
                    <button type="button" class="fx-btn fx-btn--link" id="resendButton" disabled>Reenviar código</button>
                    <button type="button" class="fx-btn fx-btn--link" id="changeEmailButton">Usar outro e-mail</button>
                </div>
            </form>

            <!-- Passo 3: nova senha -->
            <form class="acc-form" id="password-step" novalidate hidden>
                <div class="fx-banner fx-banner--danger" id="password-error" role="alert" hidden></div>
                <p class="acc-text">Escolha a nova senha. Todas as sessões abertas serão encerradas.</p>
                <div class="fx-field">
                    <label class="fx-label" for="new-password">Nova senha</label>
                    <input type="password" class="fx-input" id="new-password"
                        autocomplete="new-password" aria-describedby="password-rules" required>
                </div>
                <div class="fx-field">
                    <label class="fx-label" for="confirm-password">Confirme a nova senha</label>
                    <input type="password" class="fx-input" id="confirm-password" autocomplete="new-password" required>
                </div>
                <ul class="fx-rules" id="password-rules">
                    <li data-rule="length">Mínimo de 8 caracteres</li>
                    <li data-rule="digits">Pelo menos 3 números</li>
                    <li data-rule="special">Pelo menos 1 caractere especial</li>
                    <li data-rule="match">As duas senhas iguais</li>
                </ul>
                <label class="fx-check">
                    <input type="checkbox" id="show-password"> Mostrar senha
                </label>
                <button type="submit" class="fx-btn fx-btn--chrome" id="resetPasswordButton">Salvar nova senha</button>
            </form>

            <a class="acc-link acc-center" id="backToLogin" href="login.html">Voltar para o login</a>
        </div>
    </main>

    <script type="module" src="../../script/user-script/recover-password.ts"></script>
</body>
</body>
</html>
