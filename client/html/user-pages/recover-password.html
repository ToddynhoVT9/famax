<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Recuperação de Senha</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/auth/auth-common.css">
    <link rel="stylesheet" href="../../css/auth/recover-password.css">
</head>
<body>
    <a class="header" href="../../index.html" aria-label="FAMAX — início">
        <span class="header-name">FAMAX</span>
    </a>
    
    <main class="recovery-container">
        <h1 class="recovery-title">Recuperar senha</h1>

        <!-- Passo 1: e-mail -->
        <form class="form-group" id="email-step" novalidate>
            <p class="recovery-text">Informe o e-mail da sua conta. Enviaremos um código de 6 dígitos.</p>
            <input type="email" class="fx-input" id="email-input" placeholder="Seu e-mail"
                autocomplete="email" aria-label="E-mail" required>
            <button type="submit" class="fx-btn fx-btn--chrome" id="sendCodeButton">Enviar código</button>
            <div class="error-message" id="email-error" role="alert" hidden></div>
        </form>

        <!-- Passo 2: código -->
        <form class="form-group" id="code-step" novalidate hidden>
            <p class="recovery-text" id="code-sent-text"></p>
            <input type="text" class="fx-input code-input" id="code-input" placeholder="000000"
                inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"
                aria-label="Código de 6 dígitos" required>
            <button type="submit" class="fx-btn fx-btn--chrome" id="verifyCodeButton">Confirmar código</button>
            <div class="error-message" id="code-error" role="alert" hidden></div>
            <div class="recovery-links">
                <button type="button" class="fx-btn fx-btn--link" id="resendButton" disabled>Reenviar código</button>
                <button type="button" class="fx-btn fx-btn--link" id="changeEmailButton">Usar outro e-mail</button>
            </div>
        </form>

        <!-- Passo 3: nova senha -->
        <form class="form-group" id="password-step" novalidate hidden>
            <p class="recovery-text">Escolha a nova senha. Todas as sessões abertas serão encerradas.</p>
            <input type="password" class="fx-input" id="new-password" placeholder="Nova senha"
                autocomplete="new-password" aria-label="Nova senha" aria-describedby="password-rules" required>
            <input type="password" class="fx-input" id="confirm-password" placeholder="Confirme a nova senha"
                autocomplete="new-password" aria-label="Confirme a nova senha" required>
            <ul class="password-rules" id="password-rules">
                <li data-rule="length">Mínimo de 8 caracteres</li>
                <li data-rule="digits">Pelo menos 3 números</li>
                <li data-rule="special">Pelo menos 1 caractere especial</li>
                <li data-rule="match">As duas senhas iguais</li>
            </ul>
            <label class="fx-check show-password-check">
                <input type="checkbox" id="show-password"> Mostrar senha
            </label>
            <button type="submit" class="fx-btn fx-btn--chrome" id="resetPasswordButton">Salvar nova senha</button>
            <div class="error-message" id="password-error" role="alert" hidden></div>
        </form>

        <a class="recovery-back" id="backToLogin" href="login.html">Voltar para o login</a>
    </main>

    <script type="module" src="../../script/user-script/recover-password.ts"></script>
</body>
</html>
