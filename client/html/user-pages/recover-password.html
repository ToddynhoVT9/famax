<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Recuperação de Senha</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/auth/auth-common.css">
    <link rel="stylesheet" href="../../css/auth/recover-password.css">
</head>
<body>
    <div class="header">
        <h1>FAMAX</h1>
        <div class="subtitle">Logo</div>
    </div>
    
    <div class="recovery-container">
        <div class="recovery-title">Recuperação de Senha e/ou usuário</div>
        
        <div class="form-group" id="email-step">
            <input type="email" class="input-field" id="email-input" placeholder="Digite seu email">
            <button class="btn-generate" id="sendCodeButton">Enviar Código</button>
        </div>

        <div class="form-group" id="code-step" style="display: none; margin-top: 15px;">
            <input type="text" class="input-field" id="code-input" placeholder="Digite o Código">
            <button class="btn-generate" style="width: 70%;" id="verifyCodeButton">Enter</button>
        </div>

        <div class="form-group" id="password-step" style="display: none;">
            <input type="password" class="input-field" id="new-password" placeholder="Digite a nova senha">
            <input type="password" class="input-field" id="confirm-password" placeholder="Digite a senha novamente">
            <button class="btn-generate" style="width: 60%;" id="resetPasswordButton">Confirmar</button>
        </div>
    </div>

    <script type="module" src="../../script/user-script/recover-password.ts"></script>
</body>
</html>
