<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Login</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/auth/auth-common.css">
    <link rel="stylesheet" href="../../css/auth/login.css">
</head>

<body class="r r--nobar">
    <main class="acc" id="main-content">
        <div class="acc-col">
            <a class="acc-logo" href="../../index.html" aria-label="FAMAX, início">FAMAX</a>
            <h1 class="acc-title" id="loginTitle">Entrar</h1>

            <div class="acc-form">
                <div class="fx-banner fx-banner--success" id="login-notice" role="status" hidden></div>
                <!-- A faixa de erro fica no topo do formulário; nada muda de lugar. -->
                <div class="fx-banner fx-banner--danger" id="error-message" role="alert" hidden></div>

                <!-- Passo 1: usuário e senha -->
                <div class="acc-step" id="passwordStep">
                    <div class="fx-field">
                        <label class="fx-label" for="username">E-mail ou usuário</label>
                        <input type="text" id="username" class="fx-input" autocomplete="username">
                    </div>
                    <div class="fx-field">
                        <!-- "Mostrar senha" na linha do rótulo: assim "Entrar" fica acima do teclado no celular. -->
                        <div class="acc-labelrow">
                            <label class="fx-label" for="password">Senha</label>
                            <button type="button" class="fx-btn fx-btn--link acc-reveal" id="showPassword"
                                aria-controls="password" aria-pressed="false">Mostrar senha</button>
                        </div>
                        <input type="password" id="password" class="fx-input" autocomplete="current-password">
                    </div>
                    <button class="fx-btn fx-btn--chrome" id="loginButton">Entrar</button>
                    <!-- Logo abaixo de "Entrar": no celular, o botão fica acima do teclado. -->
                    <a href="recover-password.html" class="acc-link acc-center acc-forgot">Esqueci minha senha</a>
                    <p class="acc-switch">Não tem conta?<a class="acc-link" href="register.html">Criar conta</a></p>
                </div>

                <!-- Passo 2 (só com verificação em duas etapas): código do app -->
                <div class="acc-step" id="codeStep" hidden>
                    <p class="acc-text">Digite o código de 6 dígitos do seu app autenticador.</p>
                    <div class="fx-field">
                        <label class="fx-label" for="mfaCode">Código do app</label>
                        <input type="text" id="mfaCode" class="fx-input acc-code" placeholder="000000" inputmode="numeric"
                            autocomplete="one-time-code" maxlength="20" aria-describedby="mfaHint">
                    </div>
                    <p class="acc-hint" id="mfaHint">Sem o celular? Use um dos seus códigos de recuperação no mesmo campo.</p>
                    <button class="fx-btn fx-btn--chrome" id="mfaButton">Verificar</button>
                    <button type="button" class="fx-btn fx-btn--link acc-center" id="mfaBack">Voltar</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../../script/user-script/login.ts"></script>
</body>
</body>

</html>
