<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Login</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/auth/auth-common.css">
    <link rel="stylesheet" href="../../css/auth/login.css">
</head>

<body>
    <div class="header">
        <h1>FAMAX</h1>
        <div class="subtitle">Logo</div>
    </div>

    <div class="login-container">
        <div class="form-group">
            <div class="login-notice" id="login-notice" role="status" hidden></div>
            <!-- Passo 1: usuário e senha -->
            <div class="login-step" id="passwordStep">
                <input type="text" id="username" class="input-field" placeholder="E-mail ou usuário" autocomplete="username">
                <input type="password" id="password" class="input-field" placeholder="Senha" autocomplete="current-password">
                <a href="recover-password.html" class="forgot-password">Esqueci minha senha</a>
                <button class="btn-login" id="loginButton">Entrar</button>
            </div>
            <!-- Passo 2 (só com verificação em duas etapas): código do app -->
            <div class="login-step" id="codeStep" hidden>
                <p class="login-step-text">Digite o código de 6 dígitos do seu app autenticador.</p>
                <input type="text" id="mfaCode" class="input-field" placeholder="000000" inputmode="numeric"
                    autocomplete="one-time-code" maxlength="20" aria-label="Código de verificação">
                <p class="login-step-hint">Sem o celular? Use um dos seus códigos de recuperação.</p>
                <button class="btn-login" id="mfaButton">Verificar</button>
                <button type="button" class="login-link-btn" id="mfaBack">Voltar</button>
            </div>
            <div id="error-message" style="color: #ff6b6b; font-size: 0.9rem; text-align: center; margin-top: 15px; display: none;"></div>
        </div>
    </div>

    <script type="module" src="../../script/user-script/login.ts"></script>
</body>

</html>
