<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Home</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <!-- Posts da aba Seguindo: mesmo desenho do feed da comunidade. -->
    <link rel="stylesheet" href="../css/post.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body class="r">

    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <!-- Conteúdo Principal do Feed (renderizado por home.ts) -->
    <main class="main-content" id="main-content">
        <div class="r-col r-col--wide">
            <h1 class="visually-hidden">Página inicial</h1>
            <!-- Abas: Comunidades / Seguindo (só com sessão), no topo da coluna de
                 1080, no mesmo lugar nas duas. ?tab=following na URL. -->
            <div class="r-tabs" id="homeTabsBar" hidden>
                <div class="fx-tabs" id="homeTabs" role="tablist" aria-label="O que ver">
                    <button type="button" class="fx-tab" role="tab" id="homeTabCommunities"
                        data-tab="communities" aria-selected="true" aria-controls="homeCommunities">Comunidades</button>
                    <button type="button" class="fx-tab" role="tab" id="homeTabFollowing"
                        data-tab="following" aria-selected="false" aria-controls="homeFollowing" tabindex="-1">Seguindo</button>
                </div>
            </div>

            <section id="homeCommunities" role="tabpanel" aria-labelledby="homeTabCommunities">
                <!-- Filtro por categoria (home.ts); a escolha vai para ?categoryId= -->
                <div class="home-chips" id="homeChips" role="group" aria-label="Filtrar por categoria"></div>
                <div id="homeFeed">
                    <div class="feed-status">Carregando comunidades...</div>
                </div>
            </section>

            <!-- Posts recentes de quem você segue (GET /api/feed/following), em 760 no centro -->
            <section class="home-following" id="homeFollowing" role="tabpanel" aria-labelledby="homeTabFollowing" hidden>
                <div class="fx-posts r-edge" id="followingList"></div>
                <div id="followingEmpty" hidden></div>
                <button type="button" class="fx-btn fx-btn--outline fx-btn--pill list-more" id="followingMore" hidden>Carregar mais</button>
            </section>
        </div>
    </main>

    <script type="module" src="../script/home.ts"></script>
    <script type="module" src="../script/shared/chat-widget.ts"></script>
</body>
</html>
