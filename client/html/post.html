<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Discussão</title>
    <!-- Título e descrição reais são preenchidos por post.ts com o post. -->
    <meta name="description" id="metaDescription" content="Discussão no FAMAX">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/community.css">
    <link rel="stylesheet" href="../css/post.css">
</head>
<body>
    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="main-content" id="main-content">
        <div class="post-page">
            <div class="post-page-bar">
                <nav class="post-breadcrumb" aria-label="Você está em">
                    <a id="breadcrumbCommunity" href="home.html">Comunidade</a>
                    <span aria-hidden="true">›</span>
                    <span id="breadcrumbPost" aria-current="page">Discussão</span>
                </nav>
                <button type="button" class="post-copy-link" id="btnCopyLink" disabled>Copiar link</button>
            </div>

            <!-- O post (com os comentários abertos) é desenhado por shared/post-thread.ts -->
            <div class="tf-posts-list" id="postContainer">
                <div class="tf-feed-status" id="postStatus">Carregando discussão...</div>
            </div>
        </div>
    </main>

    <script type="module" src="../script/post.ts"></script>
    <script type="module" src="../script/shared/chat-widget.ts"></script>
</body>
</html>
