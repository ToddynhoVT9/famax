<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Discussão</title>
    <!-- Título e descrição reais são preenchidos por post.ts com o post. -->
    <meta name="description" id="metaDescription" content="Discussão no FAMAX">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/post.css">
    <link rel="stylesheet" href="../css/post-page.css">
</head>
<body class="r">
    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="main-content" id="main-content">
        <div class="r-col">
            <h1 class="visually-hidden" id="postPageTitle">Discussão</h1>
            <div class="post-page-bar">
                <nav class="post-breadcrumb" aria-label="Você está em">
                    <a id="breadcrumbCommunity" href="home.html">Comunidade</a>
                    <span class="post-breadcrumb-sep" aria-hidden="true">›</span>
                    <span id="breadcrumbPost" aria-current="page">Discussão</span>
                </nav>
                <button type="button" class="fx-btn fx-btn--outline fx-btn--pill fx-btn--sm post-copy-link" id="btnCopyLink" disabled>Copiar link</button>
            </div>

            <!-- O post (com os comentários abertos) é desenhado por shared/post-thread.ts -->
            <div class="fx-posts r-edge" id="postContainer">
                <div class="tf-feed-status" id="postStatus">Carregando discussão...</div>
            </div>
        </div>
    </main>

    <script type="module" src="../script/post.ts"></script>
    <script type="module" src="../script/shared/chat-widget.ts"></script>
</body>
</html>
