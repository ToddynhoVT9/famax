<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Comunidade</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/community.css">
</head>
<body>

    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <!-- Conteúdo Principal da Comunidade (preenchido por community.ts) -->
    <main class="main-content" id="main-content">

        <!-- Topo: capa, nome, descrição e ações -->
        <section class="tf-community-hero" id="communityHero" aria-busy="true">
            <div class="tf-community-banner" id="communityBanner">
                <span class="tf-community-initial" id="communityInitial" aria-hidden="true"></span>
            </div>
            <div class="tf-community-head">
                <div class="tf-community-info">
                    <h1 class="tf-community-name" id="communityName">Carregando...</h1>
                    <p class="tf-community-meta" id="communityMeta"></p>
                    <p class="tf-community-description" id="communityDescription" hidden></p>
                </div>
                <div class="tf-community-actions" id="communityActions"></div>
            </div>
        </section>

        <!-- Vista "Discussões" (padrão): abas, feed e widgets -->
        <div id="viewDiscussions">

        <!-- Abas -->
        <div class="tf-tabs" id="tfTabsContainer" role="tablist" aria-label="Discussões da comunidade">
            <button type="button" class="tf-tab active" role="tab" id="tab-all" data-tab="all"
                aria-selected="true" aria-controls="tfFeedPanel">Conversas</button>
            <button type="button" class="tf-tab" role="tab" id="tab-unanswered" data-tab="unanswered"
                aria-selected="false" aria-controls="tfFeedPanel" tabindex="-1">Ajudar os outros</button>
            <button type="button" class="tf-tab" role="tab" id="tab-categories" data-tab="categories"
                aria-selected="false" aria-controls="tfFeedPanel" tabindex="-1">Categorias</button>
            <div class="tf-tab-indicator" id="tfTabIndicator"></div>
        </div>

        <div class="tf-layout">
            <!-- Esquerda: lista de posts -->
            <div class="tf-main-col" id="tfFeedPanel" role="tabpanel" aria-labelledby="tab-all">
                <div class="tf-feed-toolbar">
                    <p class="tf-tab-hint" id="tfTabHint" hidden></p>
                    <label class="tf-sort">
                        <span>Ordenar por</span>
                        <select id="tfSort">
                            <option value="new">Recentes</option>
                            <option value="hot">Em alta</option>
                            <option value="top">Mais curtidos</option>
                            <option value="comments">Mais comentados</option>
                        </select>
                    </label>
                </div>
                <div class="tf-category-chips" id="tfCategoryChips" role="group"
                    aria-label="Filtrar por categoria" hidden></div>
                <div class="tf-posts-list" id="tfPostsList">
                    <div class="tf-feed-status" id="tfFeedStatus">Carregando discussões...</div>
                </div>
                <button type="button" class="tf-load-more" id="tfLoadMore" hidden>Carregar mais</button>
            </div>

            <!-- Direita: Widgets -->
            <div class="tf-sidebar-col">
                <div class="tf-widget tf-greeting-widget">
                    <h3 class="tf-widget-title-center">Algo novo a discutir?</h3>
                    <button type="button" class="tf-btn-dark" id="btnCreatePost">Compartilhe-os</button>
                </div>

                <!-- Próximos eventos (community-events.ts) -->
                <div class="tf-widget tf-upcoming-widget" id="upcomingWidget">
                    <div class="tf-widget-head">
                        <h3 class="tf-widget-title">Próximos eventos</h3>
                        <a class="tf-upcoming-all">Ver todos</a>
                    </div>
                    <div class="tf-upcoming-list" aria-live="polite">
                        <p class="tf-lb-status">Carregando...</p>
                    </div>
                </div>

                <!-- Ranking real, montado por community-leaderboard.ts -->
                <div class="tf-widget tf-leaderboard-widget" id="leaderboardWidget">
                    <h3 class="tf-widget-title">Maiores criadores</h3>
                    <div class="tf-lb-tabs" role="tablist" aria-label="Período do ranking">
                        <button type="button" class="tf-lb-tab active" role="tab" aria-selected="true"
                            data-period="week">Semanalmente</button>
                        <button type="button" class="tf-lb-tab" role="tab" aria-selected="false"
                            data-period="all">Todos os tempos</button>
                    </div>
                    <ol class="tf-lb-list" aria-live="polite"></ol>
                    <p class="tf-lb-status" hidden></p>
                    <p class="tf-lb-note">Post publicado +5 · reação recebida +2 · comentário recebido +1</p>
                </div>
            </div>
        </div>

        </div>

        <!-- Vista "Regras" (?view=rules) -->
        <section class="tf-view" id="viewRules" aria-labelledby="rulesTitle" hidden>
            <div class="tf-view-header">
                <h2 class="tf-view-title" id="rulesTitle">Regras</h2>
                <a class="tf-view-action" id="rulesEdit" hidden>Editar regras</a>
            </div>
            <div class="tf-rules-text" id="rulesText"></div>
        </section>

        <!-- Vista "Eventos" (?view=events), montada por community-events.ts -->
        <section class="tf-view" id="viewEvents" aria-labelledby="eventsTitle" hidden>
            <div class="tf-view-header">
                <h2 class="tf-view-title" id="eventsTitle">Eventos</h2>
            </div>
            <div id="eventsRoot"></div>
        </section>

        <!-- Vista "Membros" (?view=members), montada por community-members.ts -->
        <section class="tf-view" id="viewMembers" aria-labelledby="membersTitle" hidden>
            <div class="tf-view-header">
                <h2 class="tf-view-title" id="membersTitle">Membros</h2>
            </div>
            <div id="membersRoot"></div>
        </section>

    </main>

    <!-- O modal de criar/editar post é montado por script/shared/post-editor.ts -->

    <script type="module" src="../script/community.ts"></script>
    <script type="module" src="../script/shared/chat-widget.ts"></script>
</body>
</html>
