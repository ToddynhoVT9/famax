<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Pesquisa</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/search.css">
</head>
<body class="r">
    <!-- Header e sidebar: montados por script/shared/layout.ts -->
    <header id="app-header" class="header"></header>
    <aside id="app-sidebar" class="sidebar"></aside>

    <main class="main-content" id="main-content">
        <div class="r-col search-page">
            <h1 class="r-ptitle" id="searchTitle">Pesquisa</h1>

            <!-- As abas e o escopo da busca no header são o mesmo controle (search.ts). -->
            <div class="r-tabs r-tabs--rola">
                <div class="fx-tabs" role="tablist" aria-label="Pesquisar em" id="searchTabs">
                    <button type="button" class="fx-tab" role="tab" id="searchTab-all" aria-controls="searchResults" data-type="all" aria-selected="true">Tudo</button>
                    <button type="button" class="fx-tab" role="tab" id="searchTab-communities" aria-controls="searchResults" data-type="communities" aria-selected="false" tabindex="-1">Comunidades</button>
                    <button type="button" class="fx-tab" role="tab" id="searchTab-users" aria-controls="searchResults" data-type="users" aria-selected="false" tabindex="-1">Usuários</button>
                    <button type="button" class="fx-tab" role="tab" id="searchTab-posts" aria-controls="searchResults" data-type="posts" aria-selected="false" tabindex="-1">Posts</button>
                </div>
            </div>

            <div class="search-results" id="searchResults" role="tabpanel" aria-labelledby="searchTab-all" aria-live="polite"></div>

            <!-- Paginação: números do tablet ao desktop, "Carregar mais" no celular (search.ts). -->
            <nav class="search-pager" id="searchPager" aria-label="Páginas" hidden></nav>
        </div>
    </main>

    <script type="module" src="../script/search.ts"></script>
    <script type="module" src="../script/shared/chat-widget.ts"></script>
</body>
</html>
