<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Fórum</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth/index.css">
</head>

<body class="r r--nobar">
    <!-- Tela inicial (sem moldura): o bloco um pouco acima do centro (2 : 3). -->
    <main class="ini" id="main-content">
        <div class="ini-col">
            <h1 class="ini-name">FAMAX</h1>
            <p class="ini-sub">O fórum das suas comunidades.</p>
            <div class="ini-acts">
                <a href="html/user-pages/login.html" class="fx-btn fx-btn--chrome ini-btn">Entrar</a>
                <div class="ini-div" role="separator"></div>
                <!-- Link para a página de cadastro -->
                <a href="html/user-pages/register.html" class="fx-btn fx-btn--warm ini-btn">Criar conta</a>
            </div>
        </div>
    </main>

    <script type="module" src="script/index.ts"></script>
</body>
</body>

</html>
