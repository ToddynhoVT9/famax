<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- Tema escolhido à mão (shared/theme.ts), aplicado antes da primeira pintura:
         sem isto a página piscaria no tema errado até o módulo carregar. -->
    <script>try{var t=localStorage.getItem("famax_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>FAMAX - Fórum</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth/index.css">
</head>

<body>
    <h1>FAMAX</h1>

    <div class="auth-container">
        <a href="html/user-pages/login.html" class="btn btn-login">Entrar</a>

        <div class="divider"></div>

        <!-- Link para a página de cadastro -->
        <a href="html/user-pages/register.html" class="btn btn-register">Criar conta</a>
    </div>

    <script type="module" src="script/index.ts"></script>
</body>

</html>
