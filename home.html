<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #222222;
            color: #ffffff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----- CABEÇALHO ----- */
        .header {
            background-color: #828282;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end; 
            text-decoration: none;
            color: white;
            user-select: none;
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 1px;
        }

        .logo-subtext {
            font-size: 1.1rem;
            font-weight: 400;
            margin-right: 5px; 
        }

        .search-container {
            flex-grow: 1;
            max-width: 600px;
            margin: 0 30px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            outline: none;
            color: #333;
            transition: border-radius 0.1s;
        }

        .search-input:focus {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        .search-input::placeholder {
            color: #555;
        }

        /* Caixa de opções de pesquisa */
        .search-suggestions {
            position: absolute;
            top: 100%; 
            left: 0;
            width: 100%;
            background-color: #ffffff;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            z-index: 1005;
            overflow: hidden; 
        }

        .search-suggestions.show {
            display: flex; 
        }

        .suggestion-item {
            padding: 8px 16px;
            color: #000000;
            font-size: 1rem;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background-color: #f0f0f0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Container do botão de Filtros */
        .filtros-container {
            position: relative;
        }

        .btn-filtros {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s, border-radius 0.1s;
        }

        .btn-filtros:hover {
            background-color: #f0f0f0;
        }

        .btn-filtros.active {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            background-color: #f0f0f0;
        }

        /* Filtros */
        .filtros-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 160px;
            background-color: #ffffff;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            border-top-right-radius: 6px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            z-index: 1005;
            padding: 8px 0;
        }

        .filtros-dropdown.show {
            display: flex;
        }

        .filtro-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            cursor: pointer;
            color: #000000;
            font-size: 1rem;
            gap: 10px;
            user-select: none;
        }

        .filtro-item:hover {
            background-color: #f0f0f0;
        }

        .filtro-item input[type="radio"] {
            display: none;
        }

        .custom-radio {
            width: 16px;
            height: 16px;
            border: 2px solid #000000;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }

        /* Quando selecionado, preenche o espaço */
        .filtro-item input[type="radio"]:checked + .custom-radio::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: #000000;
            border-radius: 50%;
        }

        .user-profile {
            background-color: #ffffff;
            color: #000000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
        }
        
        .user-profile:hover {
            background-color: #f0f0f0;
        }

        /* ----- TOGGLE DO MENU LATERAL ----- */
        .sidebar-toggle {
            position: fixed;
            top: 100px; 
            left: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #828282;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            z-index: 1001; 
            transition: left 0.3s ease;
        }

        .sidebar-toggle span {
            display: block;
            width: 26px;
            height: 3px;
            background-color: #111; 
            border-radius: 2px;
        }

        .sidebar-toggle.open {
            left: 230px; 
        }

        /* ----- MENU LATERAL ----- */
        .sidebar {
            position: fixed;
            top: 80px; 
            left: -280px; 
            width: 250px;
            height: calc(100vh - 80px);
            background-color: #828282;
            z-index: 999;
            transition: left 0.3s ease;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 12px 20px;
            display: block;
            transition: background 0.2s ease;
        }

        .sidebar-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .sidebar-header {
            padding: 0 20px 10px 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-header .sidebar-link {
            padding: 0;
            font-size: 1.2rem;
            background: none;
        }

        .sidebar-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .create-community-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 20px 20px 10px;
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.12);
        }

        .create-community-label {
            font-size: 1rem;
            color: #ffffff;
        }

        .create-community-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background-color: #ffffff;
            color: #222;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .create-community-btn:hover {
            transform: scale(1.08);
            background-color: #f0f0f0;
        }

        .create-community-panel {
            position: fixed;
            top: 80px;
            right: -430px;
            width: min(420px, 100%);
            height: calc(100vh - 80px);
            background: #1f1f1f;
            box-shadow: -18px 0 40px rgba(0, 0, 0, 0.35);
            transition: right 0.3s ease;
            z-index: 1002;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px;
        }

        .create-community-panel.active {
            right: 0;
        }

        .create-community-panel h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .create-community-panel p {
            margin-bottom: 24px;
            color: #d1d5db;
            line-height: 1.5;
        }

        .create-community-panel label {
            display: block;
            margin-bottom: 14px;
            color: #e5e7eb;
            font-size: 0.95rem;
        }

        .create-community-panel input[type="text"],
        .create-community-panel select,
        .create-community-panel input[type="file"] {
            width: 100%;
            border-radius: 14px;
            border: 1px solid #444;
            background: #101010;
            color: #f4f4f4;
            padding: 14px 16px;
            font-size: 1rem;
            margin-top: 8px;
        }

        .create-community-panel select {
            appearance: none;
        }

        .create-community-panel .image-preview {
            min-height: 150px;
            border: 2px dashed #3d3d3d;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            color: #9ca3af;
            background: #111;
            text-align: center;
            margin-bottom: 16px;
        }

        .create-community-panel .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 16px;
            object-fit: cover;
        }

        .create-community-panel .panel-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .create-community-panel .panel-actions button {
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .create-community-panel .cancel-btn {
            background: #2f2f2f;
            color: #e5e7eb;
        }

        .create-community-panel .submit-btn {
            background: #ffffff;
            color: #111;
        }

        .create-community-panel .panel-close {
            position: absolute;
            top: 16px;
            right: 16px;
            border: none;
            background: transparent;
            color: #f4f4f4;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .sidebar-header .sidebar-link:hover {
            background-color: transparent;
        }

        /* Personalizar scrollbar da sidebar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        /* ----- CONTEÚDO PRINCIPAL ----- */
        .main-content {
            margin-top: 80px;
            padding: 30px 20px 50px 80px; 
            transition: padding-left 0.3s ease;
            flex-grow: 1;
        }

        .main-content.shifted {
            padding-left: 280px;
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            margin-left: 5px;
            letter-spacing: 0.5px;
        }

        .cards-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: #828282 transparent;
        }

        .cards-container::-webkit-scrollbar {
            height: 8px; 
            display: block; 
        }

        .cards-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background-color: #828282; 
            border-radius: 10px;
        }

        .cards-container::-webkit-scrollbar-thumb:hover {
            background-color: #a0a0a0; 
        }

        .card {
            min-width: 250px;  
            height: 400px; 
            background-color: #828282; 
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-decoration: none; /* Add this to prevent underline if it's an anchor */
        }

        .card:hover {
            transform: translateY(-5px);
            filter: brightness(1.1);
        }

        .card-content {
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 1.3;
            text-align: center;
            margin: auto;
        }

        .card-footer {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 400;
        }

        .chat-widget {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 1300;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }

        .chat-toggle {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5f5f5, #bdbdbd);
            color: #222;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
            pointer-events: auto;
            transition: transform 0.2s ease;
        }

        .chat-toggle:hover {
            transform: scale(1.04);
        }

        .chat-panel {
            display: none;
            width: min(360px, calc(100vw - 20px));
            height: min(500px, calc(100vh - 90px));
            margin-bottom: 10px;
            background: #ffffff;
            color: #111;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
            pointer-events: auto;
            flex-direction: column;
        }

        .chat-widget.open .chat-panel {
            display: flex;
        }

        .chat-header {
            background: #828282;
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 1rem;
        }

        .chat-header p {
            margin: 2px 0 0;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .chat-close {
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        .chat-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .chat-contacts {
            width: 104px;
            background: #f3f4f6;
            border-right: 1px solid #e5e7eb;
            padding: 8px;
            overflow-y: auto;
        }

        .contact-item {
            width: 100%;
            border: none;
            background: transparent;
            padding: 10px 8px;
            border-radius: 10px;
            margin-bottom: 8px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #222;
        }

        .contact-item.active {
            background: #e5e7eb;
        }

        .contact-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #828282;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .contact-name {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .chat-conversation {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .chat-messages.is-changing {
            animation: chatSlideIn 0.25s ease;
        }

        @keyframes chatSlideIn {
            from {
                transform: translateX(18px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.3;
            word-break: break-word;
        }

        .message-bubble.me {
            align-self: flex-end;
            background: #828282;
            color: #fff;
        }

        .message-bubble.other {
            align-self: flex-start;
            background: #ffffff;
            color: #111;
            border: 1px solid #e5e7eb;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
        }

        .chat-input-row input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            padding: 10px 12px;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input-row button {
            border: none;
            border-radius: 999px;
            padding: 10px 12px;
            background: #828282;
            color: #fff;
            cursor: pointer;
        }

        @media (max-width: 640px) {
            .chat-widget {
                bottom: 12px;
                right: 12px;
                left: 12px;
                align-items: stretch;
            }

            .chat-toggle {
                width: 52px;
                height: 52px;
                align-self: flex-end;
            }

            .chat-panel {
                width: 100%;
                height: min(78vh, 520px);
                margin-bottom: 8px;
            }

            .chat-body {
                flex-direction: column;
            }

            .chat-contacts {
                width: 100%;
                max-height: 112px;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
                display: flex;
                gap: 8px;
                overflow-x: auto;
            }

            .contact-item {
                min-width: 74px;
            }

            .chat-input-row {
                padding: 8px;
            }
        }
        
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <a href="#" class="logo-container">
            <span class="logo-text">FAMAX</span>
            <span class="logo-subtext">Logo</span>
        </a>
        
        <div class="search-container">
            <!-- Barra de pesquisa -->
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar comunidade">
            
            <!-- Sugestões de pesquisa -->
            <div class="search-suggestions" id="searchSuggestions">
                <div class="suggestion-item">Carregando sugestões...</div>
            </div>
        </div>
        
        <div class="header-actions">
            <!-- Container do botão filtros -->
            <div class="filtros-container">
                <button class="btn-filtros" id="btnFiltros">Filtros</button>
                <div class="filtros-dropdown" id="filtrosDropdown">
                    <label class="filtro-item">
                        <input type="radio" name="filtroOpcao" value="categorias" checked>
                        <span class="custom-radio"></span>
                        Categorias
                    </label>
                    <label class="filtro-item">
                        <input type="radio" name="filtroOpcao" value="comunidades">
                        <span class="custom-radio"></span>
                        Comunidades
                    </label>
                    <label class="filtro-item">
                        <input type="radio" name="filtroOpcao" value="usuarios">
                        <span class="custom-radio"></span>
                        Usuários
                    </label>
                    <label class="filtro-item">
                        <input type="radio" name="filtroOpcao" value="posts">
                        <span class="custom-radio"></span>
                        Posts
                    </label>
                </div>
            </div>
            
            <div class="user-profile" onclick="window.location.href='perfil.html'">usuário</div>
        </div>
    </header>

    <!--logo abaixo do HEADER na lateral -->
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Menu Lateral -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <!-- Título principal com linha embaixo -->
            <div class="sidebar-header">
                <a href="#" class="sidebar-link">Página Inicial</a>
            </div>
            
            <!-- Lista de comunidades (Renderizadas pelo Backend) -->
            <a href="comunidade.html" class="sidebar-link">Minha Comunidade Exemplo</a>
        </div>
        <div class="create-community-row">
            <span class="create-community-label">Criar comunidade</span>
            <button class="create-community-btn" id="openCreateCommunity" type="button">+</button>
        </div>
    </aside>

    <!-- Conteúdo Principal do Feed -->
    <main class="main-content" id="main-content">
        
        <!-- Categoria Template (Renderizada pelo Backend) -->
        <section class="category-section">
            <h2 class="category-title">Nome da Categoria</h2>
            <div class="cards-container">
                <!-- Cartão de Template -->
                <a href="comunidade.html" class="card">
                    <div class="card-content">Imagem/<br>Capa</div>
                    <div class="card-footer">Nome da Comunidade</div>
                </a>
            </div>
        </section>

        <div class="create-community-panel" id="createCommunityPanel" aria-hidden="true">
            <button class="panel-close" id="closeCreateCommunity" type="button" aria-label="Fechar">×</button>
            <h2>Criar nova comunidade</h2>
            <p>Preencha o nome, escolha a categoria e adicione uma capa para sua comunidade.</p>
            <form id="createCommunityForm">
                <label for="communityName">Nome da comunidade
                    <input id="communityName" name="communityName" type="text" placeholder="Ex: Gamers do bairro" required>
                </label>
                <label for="communityCategory">Categoria
                    <select id="communityCategory" name="communityCategory" required>
                        <option value="">Selecione a categoria</option>
                        <option value="jogo">Jogo</option>
                        <option value="estudo">Estudo</option>
                        <option value="arte">Arte</option>
                        <option value="lazer">Lazer</option>
                        <option value="outros">Outros</option>
                    </select>
                </label>
                <label for="communityCover">Capa da comunidade
                    <input id="communityCover" name="communityCover" type="file" accept="image/*">
                </label>
                <div class="image-preview" id="imagePreview">Nenhuma imagem selecionada</div>
                <div class="panel-actions">
                    <button class="cancel-btn" id="cancelCreateCommunity" type="button">Cancelar</button>
                    <button class="submit-btn" type="submit">Criar comunidade</button>
                </div>
            </form>
        </div>

    </main>

    <script>
        // Funcionalidade de alternar o Menu Lateral
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebarToggle');
            
            sidebar.classList.toggle('open');
            toggleBtn.classList.toggle('open');
        }

        // Funcionalidade de exibir sugestões de pesquisa
        const searchInput = document.getElementById('searchInput');
        const searchSuggestions = document.getElementById('searchSuggestions');

        // Mostra opções ao clicar/digitar no input
        searchInput.addEventListener('focus', () => {
            searchSuggestions.classList.add('show');
        });

        // Funcionalidade de exibir dropdown de Filtros
        const btnFiltros = document.getElementById('btnFiltros');
        const filtrosDropdown = document.getElementById('filtrosDropdown');

        btnFiltros.addEventListener('click', (event) => {
            event.stopPropagation(); // Evita propagar para o document click
            filtrosDropdown.classList.toggle('show');
            btnFiltros.classList.toggle('active');
        });

        // Oculta opções ao clicar fora dos componentes abertos
        document.addEventListener('click', (event) => {
            // Fechar pesquisa
            if (!searchInput.contains(event.target) && !searchSuggestions.contains(event.target)) {
                searchSuggestions.classList.remove('show');
            }
            
            // Fechar filtros
            if (!btnFiltros.contains(event.target) && !filtrosDropdown.contains(event.target)) {
                filtrosDropdown.classList.remove('show');
                btnFiltros.classList.remove('active');
            }

            // Fechar chat somente se clicar fora do painel e não for em um contato
            const chatWidget = document.getElementById('chatWidget');
            const clickedInsideChat = chatWidget.contains(event.target);
            if (chatWidget.classList.contains('open') && !clickedInsideChat) {
                chatWidget.classList.remove('open');
            }
        });

        const openCreateCommunity = document.getElementById('openCreateCommunity');
        const createCommunityPanel = document.getElementById('createCommunityPanel');
        const closeCreateCommunity = document.getElementById('closeCreateCommunity');
        const cancelCreateCommunity = document.getElementById('cancelCreateCommunity');
        const communityForm = document.getElementById('createCommunityForm');
        const communityCover = document.getElementById('communityCover');
        const imagePreview = document.getElementById('imagePreview');

        function toggleCreatePanel(show) {
            createCommunityPanel.classList.toggle('active', show);
            createCommunityPanel.setAttribute('aria-hidden', show ? 'false' : 'true');
            if (show) {
                communityForm.reset();
                imagePreview.textContent = 'Nenhuma imagem selecionada';
            }
        }

        openCreateCommunity.addEventListener('click', () => toggleCreatePanel(true));
        closeCreateCommunity.addEventListener('click', () => toggleCreatePanel(false));
        cancelCreateCommunity.addEventListener('click', () => toggleCreatePanel(false));

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && createCommunityPanel.classList.contains('active')) {
                toggleCreatePanel(false);
            }
        });

        communityCover.addEventListener('change', () => {
            const file = communityCover.files[0];
            if (!file) {
                imagePreview.textContent = 'Nenhuma imagem selecionada';
                return;
            }
            const reader = new FileReader();
            reader.onload = () => {
                imagePreview.innerHTML = '';
                const img = document.createElement('img');
                img.src = reader.result;
                img.alt = 'Prévia da capa da comunidade';
                imagePreview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });

        function getCategoryLabel(value) {
            const labels = {
                jogo: 'Jogo',
                estudo: 'Estudo',
                arte: 'Arte',
                lazer: 'Lazer',
                outros: 'Outros'
            };
            return labels[value] || 'Categoria';
        }

        function findOrCreateCategorySection(categoryValue) {
            const categoryLabel = getCategoryLabel(categoryValue);
            const existingSection = Array.from(document.querySelectorAll('.category-section')).find((section) => section.dataset.category === categoryValue);
            if (existingSection) {
                return existingSection.querySelector('.cards-container');
            }

            const section = document.createElement('section');
            section.className = 'category-section';
            section.dataset.category = categoryValue;
            section.innerHTML = `
                <h2 class="category-title">${categoryLabel}</h2>
                <div class="cards-container"></div>
            `;
            document.getElementById('main-content').appendChild(section);
            return section.querySelector('.cards-container');
        }

        function createCommunityCard(name, categoryValue, imageUrl) {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = 'comunidade.html';
            card.style.backgroundImage = imageUrl ? `url('${imageUrl}')` : 'none';
            card.style.backgroundSize = 'cover';
            card.style.backgroundPosition = 'center';
            card.innerHTML = `
                <div class="card-content">${name}</div>
                <div class="card-footer">${getCategoryLabel(categoryValue)}</div>
            `;
            return card;
        }

        function addSidebarCommunityLink(name) {
            const link = document.createElement('a');
            link.className = 'sidebar-link';
            link.href = 'comunidade.html';
            link.textContent = name;
            document.getElementById('sidebar').appendChild(link);
        }

        communityForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const name = document.getElementById('communityName').value.trim();
            const category = document.getElementById('communityCategory').value;
            const file = communityCover.files[0];

            if (!name || !category) {
                return;
            }

            const addCard = (imageUrl) => {
                const cardsContainer = findOrCreateCategorySection(category);
                const newCard = createCommunityCard(name, category, imageUrl);
                cardsContainer.appendChild(newCard);
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    addCard(reader.result);
                };
                reader.readAsDataURL(file);
            } else {
                addCard('');
            }

            addSidebarCommunityLink(name);
            toggleCreatePanel(false);
        });


    </script>
    <script src="js/chat-widget.js"></script>
</body>
</html>
