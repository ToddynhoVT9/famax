<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Fórum</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222222;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
        }

        h1 {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
            margin-bottom: 3rem;
        }

        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .btn {
            width: 300px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-login {
            background-color: #828282;
        }

        .btn-login:hover {
            background-color: #929292;
        }

        .divider {
            width: 360px;
            height: 2px;
            background-color: #ffffff;
            margin: 25px 0;
        }

        .btn-register {
            background-color: #b5acac;
        }

        .btn-register:hover {
            background-color: #c4bbbb;
        }
    </style>
</head>

<body>
    <h1>FAMAX</h1>

    <div class="auth-container">
        <a href="login.html" class="btn btn-login">Entrar</a>

        <div class="divider"></div>

        <!-- Link para a página de cadastro -->
        <a href="cadastro.html" class="btn btn-register">Criar conta</a>
    </div>
</body>

</html>
