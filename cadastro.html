<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Criar uma conta</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222222;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            position: absolute;
            top: 30px;
            left: 50px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            line-height: 1;
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 2px;
            margin-right: 5px;
        }

        .register-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .register-title {
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 380px;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #7b7b7b;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 12px;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: #e0e0e0;
        }

        .input-field:focus {
            outline: 2px solid #ffffff;
            background-color: #888888;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 10px 0 20px 0;
            font-size: 0.95rem;
        }

        .checkbox-container input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #444;
        }

        .terms-text {
            cursor: pointer;
            text-decoration: underline;
            color: #ffffff;
        }

        .btn-register {
            width: 80%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #7b7b7b;
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .btn-register:hover {
            background-color: #888888;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #444444;
            width: 80%;
            max-width: 900px;
            max-height: 80vh;
            border-radius: 8px;
            padding: 30px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            color: #ffffff;
        }

        .modal-title {
            text-align: center;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .modal-body p {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
            text-align: justify;
            color: #e0e0e0;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #ffffff;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
        }
        
        .close-btn:hover {
            color: #aaaaaa;
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

    </style>
</head>
<body>
    <div class="header">
        <h1>FAMAX</h1>
        <div class="subtitle">Logo</div>
    </div>
    
    <div class="register-container">
        <div class="register-title">Criar uma conta</div>
        
        <div class="form-group">
            <input type="email" id="email" class="input-field" placeholder="E-mail">
            <input type="password" id="password" class="input-field" placeholder="Senha">
            <input type="password" id="confirm-password" class="input-field" placeholder="Confirmar senha">
            <input type="text" id="username" class="input-field" placeholder="Nome de usuário">
            
            <div class="checkbox-container">
                <input type="checkbox" id="terms-checkbox">
                <label for="terms-checkbox">Aceitar <a href="termos-de-uso.html" target="_blank" class="terms-text">termos de usuário</a></label>
            </div>
            
            <button class="btn-register" onclick="handleRegister()">Cadastrar</button>
            <div id="register-error" class="error-message"></div>
        </div>
    </div>

    <script>
        const errorElement = document.getElementById('register-error');

        function handleRegister() {
            errorElement.style.display = 'none';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const username = document.getElementById('username').value.trim();
            const termsChecked = document.getElementById('terms-checkbox').checked;

            if (!email || !password || !confirmPassword || !username) {
                showError('Por favor, preencha todos os campos.');
                return;
            }

            // Exigência: mínimo 8 caracteres, 3 números e 1 caractere especial
            const numberCount = (password.match(/\d/g) || []).length;
            const specialCount = (password.match(/[^A-Za-z0-9]/g) || []).length;
            
            if (password.length < 8 || numberCount < 3 || specialCount < 1) {
                showError('A senha precisa ter no mínimo 8 caracteres, 3 números e 1 caractere especial.');
                return;
            }

            if (password !== confirmPassword) {
                showError('As senhas não coincidem.');
                return;
            }

            // Validação de nome de usuário existente (Simulação com lista pré-definida)
            const usuariosExistentes = ['admin', 'teste', 'famax'];
            if (usuariosExistentes.includes(username.toLowerCase())) {
                showError('Esse nome de usuário já está em uso.');
                return;
            }

            if (!termsChecked) {
                showError('Você precisa aceitar os termos de usuário para criar a conta.');
                return;
            }

            // Redirecionamento em caso de sucesso
            alert('Conta cadastrada com sucesso!');
            window.location.href = 'index.html';
        }

        function showError(msg) {
            errorElement.innerText = msg;
            errorElement.style.display = 'block';
        }
    </script>
</body>
</html>
