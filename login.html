<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222222;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            position: absolute;
            top: 30px;
            left: 50px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            line-height: 1;
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 2px;
            margin-right: 5px;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            width: 320px;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #7b7b7b;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: #e0e0e0;
        }

        .input-field:focus {
            outline: 2px solid #ffffff;
            background-color: #888888;
        }

        .forgot-password {
            color: #ffffff;
            font-size: 0.9rem;
            text-decoration: none;
            text-align: center;
            margin: 10px 0 25px 0;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #7b7b7b;
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:hover {
            background-color: #888888;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>FAMAX</h1>
        <div class="subtitle">Logo</div>
    </div>

    <div class="login-container">
        <div class="form-group">
            <input type="text" id="username" class="input-field" placeholder="E-mail ou usuário">
            <input type="password" id="password" class="input-field" placeholder="Senha">
            <a href="recuperar-senha.html" class="forgot-password">Esqueci minha senha</a>
            <button class="btn-login" onclick="realizarLogin()">Entrar</button>
            <div id="error-message" style="color: #ff6b6b; font-size: 0.9rem; text-align: center; margin-top: 15px; display: none;"></div>
        </div>
    </div>

    <script>
        function realizarLogin() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorElement = document.getElementById('error-message');
            
            errorElement.style.display = 'none'; // Reseta a mensagem de erro
            
            if (usernameInput === '') {
                errorElement.innerText = "Por favor, digite seu e-mail ou usuário.";
                errorElement.style.display = 'block';
                return;
            }
            
            // Simulação de banco de dados
            // Usuários válidos: 'admin' (senha '123') ou 'teste@famax.com' (senha 'senha123')
            const usuariosValidos = ['admin', 'teste@famax.com'];
            
            // Verifica o usuário
            if (!usuariosValidos.includes(usernameInput)) {
                errorElement.innerText = "Esse email e/ou usuario não existe ou está digitado errado";
                errorElement.style.display = 'block';
                return;
            }
            
            // Se o usuário existir, verifica a senha
            let senhaCorreta = false;
            if (usernameInput === 'admin' && passwordInput === '123') senhaCorreta = true;
            if (usernameInput === 'teste@famax.com' && passwordInput === 'senha123') senhaCorreta = true;
            
            if (!senhaCorreta) {
                errorElement.innerText = "senha incorreta, tente novamente";
                errorElement.style.display = 'block';
                return;
            }
            
            // Sucesso!
            window.location.href = 'home.html';
        }
    </script>
</body>

</html>
