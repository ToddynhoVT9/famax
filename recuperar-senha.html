<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMAX - Recuperação de Senha</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222222;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            position: absolute;
            top: 30px;
            left: 50px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            line-height: 1;
            letter-spacing: 1px;
        }

        .header .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 2px;
            margin-right: 5px;
        }

        .recovery-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .recovery-title {
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 40px;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 380px;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #7b7b7b;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: #e0e0e0;
        }

        .input-field:focus {
            outline: 2px solid #ffffff;
            background-color: #888888;
        }

        .btn-generate {
            width: 80%; 
            padding: 10px;
            border: none;
            border-radius: 6px;
            background-color: #7b7b7b;
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .btn-generate:hover {
            background-color: #888888;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>FAMAX</h1>
        <div class="subtitle">Logo</div>
    </div>
    
    <div class="recovery-container">
        <div class="recovery-title">Recuperação de Senha e/ou usuário</div>
        
        <div class="form-group" id="email-step">
            <input type="email" class="input-field" id="email-input" placeholder="Digite seu email">
            <button class="btn-generate" onclick="return showCodeStep()">Enviar Código</button>
        </div>

        <div class="form-group" id="code-step" style="display: none; margin-top: 15px;">
            <input type="text" class="input-field" id="code-input" placeholder="Digite o Código">
            <button class="btn-generate" style="width: 70%;" onclick="verifyCode()">Enter</button>
        </div>

        <div class="form-group" id="password-step" style="display: none;">
            <input type="password" class="input-field" id="new-password" placeholder="Digite a nova senha">
            <input type="password" class="input-field" id="confirm-password" placeholder="Digite a senha novamente">
            <button class="btn-generate" style="width: 60%;" onclick="resetPassword()">Confirmar</button>
        </div>
    </div>

    <script>
        function showCodeStep() {
            const emailInput = document.getElementById('email-input');
            if (emailInput.value.trim() !== '') {
                document.getElementById('code-step').style.display = 'flex';
            } else {
                alert('Por favor, digite seu email primeiro.');
                emailInput.focus();
            }
        }

        function verifyCode() {
            const codeInput = document.getElementById('code-input');
            if (codeInput.value.trim() !== '') {
                // Esconde as etapas anteriores
                document.getElementById('email-step').style.display = 'none';
                document.getElementById('code-step').style.display = 'none';
                
                // Mostra a etapa de nova senha
                document.getElementById('password-step').style.display = 'flex';
            } else {
                alert('Por favor, digite o código recebido.');
                codeInput.focus();
            }
        }

        function resetPassword() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (newPassword === '' || confirmPassword === '') {
                alert('Por favor, preencha as duas senhas.');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alert('As senhas não coincidem.');
                return;
            }
            
            alert('Senha alterada com sucesso!');
            window.location.href = 'index.html';
        }
    </script>
<script src="js/chat-widget.js"></script>
</body>
</html>
